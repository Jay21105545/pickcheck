id: ux/inline-hex-threshold
category: ui-ux
severity: warn
tier: regex
title: Many inline hex colors in one file
files:
  - "**/*.{ts,tsx,js,jsx,css,scss}"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!**/*.config.*"
  - "!**/fixtures/**"
  # Brand/logo icon SVGs legitimately carry many literal hex values —
  # they're externally-mandated brand colors, not this app's own design
  # tokens drifting. Found firing on real third-party brand icon
  # components during calibration — see DECISIONS/0014.
  - "!**/icons/**"
  - "!**/logos/**"
  - "!**/brand/**"
  # Same Next.js special convention files excluded by
  # ux/fetch-missing-states — these render via the edge runtime's Satori
  # layout engine, which has limited CSS custom-property support, so
  # literal color values are often unavoidable rather than drift.
  - "!**/opengraph-image.{ts,tsx}"
  - "!**/twitter-image.{ts,tsx}"
  - "!**/icon.{ts,tsx}"
  - "!**/apple-icon.{ts,tsx}"
message: "This file has several one-off inline hex colors instead of a shared design-token/theme reference — a sign colors have drifted out of any central palette."
weight: 1
pattern:
  # Negative lookbehind excludes a hex literal that IS the value of a CSS
  # custom-property declaration (`--token-name: #hex;`) — the token
  # *definition* site, not scattered *usage*. A real design-token/theme
  # module (DECISIONS/0019) legitimately defines many colors this way in
  # one place, which is exactly the "shared reference" this rule's message
  # asks drifted files to adopt — it shouldn't itself count as the drift.
  # `color: #hex`, `background: #hex`, inline `style={{ color: "#hex" }}`,
  # etc. are all still counted normally: only the `--name: #hex` shape is
  # exempt. See fixtures/good/src/design-tokens.css (a real palette file,
  # must NOT trigger) vs. fixtures/bad/src/Palette.tsx (many-hex file
  # named "Palette", but hex used as scattered inline styles — must still
  # trigger; naming alone was never the signal).
  regex: '(?<!--[\w-]+:\s*)#[0-9a-fA-F]{3,8}\b'
  minCount: 5
