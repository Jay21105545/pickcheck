id: ux/form-submit-no-pending
category: ui-ux
severity: warn
tier: astgrep
title: Submit button with no pending/disabled state
files:
  - "**/*.{tsx,jsx}"
  - "!**/fixtures/**"
message: "This submit button has no disabled attribute — a user can click it repeatedly (double-submitting the form) with no visual sign the request is in flight."
weight: 2
pattern:
  rule:
    any:
      - kind: jsx_self_closing_element
      - kind: jsx_opening_element
    has:
      kind: identifier
      regex: "^button$"
    all:
      - has:
          kind: jsx_attribute
          regex: '^type\s*=\s*"submit"$'
      - not:
          any:
            - has:
                kind: jsx_attribute
                has:
                  kind: property_identifier
                  regex: "^disabled$"
            # A sign-out/log-out action has no real double-submission
            # consequence — found flagged as a false positive during
            # calibration (DECISIONS/0014). Checks the button's own
            # aria-label, and its rendered text anywhere in its subtree
            # (covers icon+label patterns like
            # <LogOut /><span>Sign out</span>).
            - has:
                kind: jsx_attribute
                regex: '(?i)aria-label\s*=\s*"[^"]*(sign\s*out|log\s*out|logout)'
            - inside:
                kind: jsx_element
                has:
                  stopBy: end
                  regex: '(?i)sign\s*out|log\s*out|logout'
