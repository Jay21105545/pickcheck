id: ux/fetch-missing-states
category: ui-ux
severity: warn
tier: regex
title: Component fetches data but renders only the success branch
files:
  - "**/*.{tsx,jsx}"
  - "!**/*.test.*"
  - "!**/*.spec.*"
  - "!**/__tests__/**"
  - "!**/test/**"
  - "!**/tests/**"
  - "!**/fixtures/**"
  - "!**/api/**"
  # Next.js's special convention files (metadata/OG-image routes) aren't
  # UI components — they render a static-ish asset (an image, an icon)
  # server-side, with no "user watching a loading state" concept, and a
  # failed fetch inside one fails the whole route rather than degrading
  # silently. Found firing on app/opengraph-image.tsx during calibration
  # — see DECISIONS/0014.
  - "!**/opengraph-image.{ts,tsx}"
  - "!**/twitter-image.{ts,tsx}"
  - "!**/icon.{ts,tsx}"
  - "!**/apple-icon.{ts,tsx}"
message: "This component fetches data but nothing in the file suggests it renders a loading, error, or empty state — only the success path appears to be handled."
weight: 2
pattern:
  regex: '\b(fetch|axios\.\w+|useQuery|useSWR)\s*\('
  unless:
    regex: '\b(loading|isLoading|isPending|pending|skeleton|Spinner|Suspense|isError|error|catch|failed|fallback|empty|EmptyState|noResults|no\s+results)\b'
    flags: i
