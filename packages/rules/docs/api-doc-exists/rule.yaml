id: docs/api-doc-exists
category: docs
severity: warn
tier: exists
title: API surface detected with no API.md or openapi spec
files:
  - "API.md"
  - "openapi.json"
  - "openapi.yaml"
  - "openapi.yml"
message: "An API surface was detected but no API.md or openapi.* spec documents it."
weight: 2
pattern:
  mode: present
  when:
    files:
      - "app/api/**"
      - "pages/api/**"
      - "routes/**"
      - "src/routes/**"
      - "api/**"
      # Serverless/edge function conventions — an HTTP surface just as
      # much as an `app/api/` route, and just as much in need of docs.
      # Same Next.js-shaped blind spot sec/post-has-validation had; both
      # were widened together in DECISIONS/0027.
      - "**/supabase/functions/**"
      - "**/netlify/functions/**"
      - "**/netlify/edge-functions/**"
      - "!**/fixtures/**"
