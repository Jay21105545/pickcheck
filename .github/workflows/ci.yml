name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # Must precede `pnpm test`: publishable-package.test.ts asserts against
      # the real built artifact in dist/ (no workspace: protocols, no
      # unbundled @pickcheck/* imports, data assets present, startup graph
      # under budget). Those guards exist because pickcheck@0.1.0 shipped
      # uninstallable while every source-level check passed — see
      # DECISIONS/0021.
      - run: pnpm build

      - run: pnpm test

      - run: pnpm check

      - run: pnpm self-audit
