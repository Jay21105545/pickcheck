name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # Required for `npm publish --provenance` (OIDC token minting) —
      # see the "release" script's NPM_CONFIG_PROVENANCE env var below.
      id-token: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - run: pnpm install --frozen-lockfile

      # Same gate CONTRIBUTING.md asks of every PR — a release workflow
      # publishing without it would be a weaker guarantee than a human PR.
      #
      # `build` must precede `test`, exactly as in ci.yml: the artifact
      # guards in publishable-package.test.ts assert against the real
      # dist/ (no workspace: protocols, no unbundled @pickcheck/* imports,
      # data assets shipped, startup graph under budget), which doesn't
      # exist on a fresh checkout. Adding it to ci.yml alone is what left
      # this workflow red — see DECISIONS/0021 and 0022.
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - run: pnpm check
      - run: pnpm self-audit

      # The standard changesets two-phase flow. On every push to main this
      # step does exactly one of two things:
      #
      #   pending changesets in .changeset/  -> opens/updates the
      #     "Version Packages" PR (runs `changeset version` on a branch).
      #     Nothing is published.
      #   no pending changesets              -> runs the `publish` command.
      #
      # A push that changes no versions therefore cannot publish: the
      # publish path still runs, but `changeset publish` asks the registry
      # for each package's published versions and only publishes when the
      # local version is absent (getPublishPlan.mjs's
      # getUnpublishedPackages). Same-version pushes are a no-op, and
      # private packages (@pickcheck/rules, /report, /corpus) are filtered
      # out before that check, so they can never be published by accident.
      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
        env:
          # Needs "Allow GitHub Actions to create and approve pull
          # requests" enabled in repo settings, or the Version Packages PR
          # can't be opened — see CONTRIBUTING.md's release section.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # actions/setup-node's registry-url above writes an .npmrc that
          # reads the token from NODE_AUTH_TOKEN. NPM_TOKEN is set
          # alongside it because some tooling reads that name instead.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Enables `npm publish --provenance` without a CLI flag, via
          # npm's NPM_CONFIG_<KEY> env convention.
          #
          # The path this takes is worth spelling out, because it is not
          # what it looks like: changesets picks a publish tool from the
          # workspace type, so in this repo it runs `pnpm publish`, not
          # `npm publish` — and it never passes --provenance itself.
          # `pnpm publish` in turn delegates the actual publish to npm,
          # which inherits this env var (verified: `npm config get
          # provenance` reports true both directly and when spawned
          # through pnpm). Provenance also needs `id-token: write` above
          # and the `repository` field in packages/cli/package.json.
          NPM_CONFIG_PROVENANCE: true

      # Makes the outcome legible in the Actions UI, so "did this publish?"
      # doesn't require reading the changesets step's log.
      - name: Summarize outcome
        run: |
          if [ "${{ steps.changesets.outputs.published }}" = "true" ]; then
            echo "### Published to npm with provenance" >> "$GITHUB_STEP_SUMMARY"
            echo '${{ steps.changesets.outputs.publishedPackages }}' >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "${{ steps.changesets.outputs.pullRequestNumber }}" ]; then
            echo "### Version Packages PR #${{ steps.changesets.outputs.pullRequestNumber }} opened/updated — merge it to release" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### No release: no pending changesets, and every version is already on npm" >> "$GITHUB_STEP_SUMMARY"
          fi
